name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop
      - sketch

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужна полная история для diff

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # No external dependencies needed - using built-in Python modules only
          echo "✅ Python dependencies ready"

      - name: Index documentation with RAG
        run: |
          cd assistant
          python3 -c "from simple_rag import SimpleRAG; rag = SimpleRAG(); rag.index_all()"
          echo "✅ RAG indexing completed"

      - name: Run AI Code Review
        id: review
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          cd assistant
          python3 code_reviewer.py ${{ github.base_ref }} > review.txt
          cat review.txt
          echo "✅ Code review completed"

      - name: Post review as comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewPath = 'assistant/review_output.md';

            if (!fs.existsSync(reviewPath)) {
              console.log('Review file not found');
              return;
            }

            const review = fs.readFileSync(reviewPath, 'utf8');

            // Получаем существующие комментарии
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Ищем предыдущий комментарий от бота
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🤖 AI Code Review')
            );

            if (botComment) {
              // Обновляем существующий комментарий
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: review
              });
              console.log('Updated existing review comment');
            } else {
              // Создаем новый комментарий
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: review
              });
              console.log('Created new review comment');
            }

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: assistant/review_output.md
          retention-days: 30
