name: Build Time Statistics

on:
  push:
    branches:
      - main
      - master
      - develop
      - sketch
      - 'lesson_*'

jobs:
  build-and-track:
    name: Build and Track Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Measure build time
        id: build
        run: |
          START_TIME=$(date +%s)

          echo "🚀 Starting build..."
          if ./gradlew build --no-daemon; then
            BUILD_SUCCESS=true
            echo "✅ Build completed successfully!"
          else
            BUILD_SUCCESS=false
            echo "❌ Build failed!"
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "success=$BUILD_SUCCESS" >> $GITHUB_OUTPUT

          echo ""
          echo "⏱️  Build duration: ${DURATION} seconds"

      - name: Load previous statistics
        id: load_stats
        continue-on-error: true
        run: |
          # Try to get the stats file from the repository
          if [ -f assistant/build_stats.json ]; then
            echo "📊 Found existing statistics file"
          else
            echo "📊 No existing statistics file found"
          fi

      - name: Update build statistics
        env:
          COMMIT_HASH: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DURATION: ${{ steps.build.outputs.duration }}
        run: |
          cd assistant
          python3 build_stats.py "$DURATION" "$COMMIT_HASH" "$BRANCH"

      - name: Display statistics
        run: |
          cd assistant
          python3 build_stats.py --show

      - name: Upload statistics artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-statistics
          path: assistant/build_stats.json
          retention-days: 90

      - name: Create stats summary
        if: always()
        run: |
          cd assistant

          echo "## 📊 Build Time Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f build_stats.json ]; then
            CURRENT_TIME=$(python3 -c "import json; data=json.load(open('build_stats.json')); print(data['summary']['current_time'])")
            AVG_TIME=$(python3 -c "import json; data=json.load(open('build_stats.json')); print(round(data['summary']['average_time'], 2))")
            FASTEST_TIME=$(python3 -c "import json; data=json.load(open('build_stats.json')); print(data['summary']['fastest_time'])")
            SLOWEST_TIME=$(python3 -c "import json; data=json.load(open('build_stats.json')); print(data['summary']['slowest_time'])")
            TOTAL_BUILDS=$(python3 -c "import json; data=json.load(open('build_stats.json')); print(data['summary']['total_builds'])")

            echo "| Metric | Time |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Current Build | ${CURRENT_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Average Build | ${AVG_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚀 Fastest Build | ${FASTEST_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 🐌 Slowest Build | ${SLOWEST_TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 📈 Total Builds | ${TOTAL_BUILDS} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No statistics available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment statistics on commit
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const statsPath = 'assistant/build_stats.json';

            if (!fs.existsSync(statsPath)) {
              console.log('No stats file found');
              return;
            }

            const stats = JSON.parse(fs.readFileSync(statsPath, 'utf8'));
            const summary = stats.summary;

            const currentTime = summary.current_time;
            const avgTime = summary.average_time.toFixed(2);
            const fastestTime = summary.fastest_time;
            const slowestTime = summary.slowest_time;
            const totalBuilds = summary.total_builds;

            const diffFromAvg = currentTime - avgTime;
            const diffPercent = ((diffFromAvg / avgTime) * 100).toFixed(1);
            const diffEmoji = diffFromAvg > 0 ? '⚠️' : '✅';
            const diffText = diffFromAvg > 0 ? 'SLOWER' : 'FASTER';

            const comment = `## 📊 Build Time Statistics

            | Metric | Time |
            |--------|------|
            | ⏱️ Current Build | ${currentTime}s |
            | 📊 Average Build | ${avgTime}s |
            | 🚀 Fastest Build | ${fastestTime}s |
            | 🐌 Slowest Build | ${slowestTime}s |
            | 📈 Total Builds | ${totalBuilds} |

            ${diffEmoji} Current build is **${Math.abs(diffFromAvg).toFixed(2)}s** (${Math.abs(diffPercent)}%) **${diffText}** than average

            ---
            *Generated by Build Time Statistics workflow*`;

            console.log('Build statistics tracked successfully');
