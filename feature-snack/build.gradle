plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "dev.kamikaze.feature_snack"

    compileSdkVersion buildConfigVersion.sdk

    defaultConfig {
        minSdkVersion buildConfigVersion.min_sdk
        targetSdkVersion buildConfigVersion.sdk


        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        consumerProguardFiles "consumer-rules.pro"
    }

    signingConfigs {
        release {
            storeFile file("release-key.keystore")
            storePassword "storeflow"
            keyAlias "mike"
            keyPassword "orangeflow"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            //debuggable true
            buildConfigField "String", "APP_LINK", '""'
            buildConfigField "String", "BASE_URL", "\"https://api.themoviedb.org/3/\""
            buildConfigField "String", "API_KEY", "\"6521adbdad09387a278353f36e241434\""
        }
    }

    lintOptions {
        checkDependencies true
        disable "ContentDescription", "AlwaysShowAction"
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

}

dependencies {

    //Todo Material Design
    implementation  material_design
}