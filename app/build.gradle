plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'androidx.navigation.safeargs'
}

android {
    namespace "dev.kamikaze.movike"

    compileSdkVersion buildConfigVersion.sdk

    defaultConfig {
        minSdkVersion buildConfigVersion.min_sdk
        targetSdkVersion buildConfigVersion.sdk

        applicationId = id
        versionCode = code
        versionName = name

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("release-key.keystore")
            storePassword "storeflow"
            keyAlias "mike"
            keyPassword "orangeflow"
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
            // For production, you might want to use a different URL or leave empty
            buildConfigField "String", "ASSISTANT_BASE_URL", "\"http://10.0.2.2:5001\""
        }
        debug {
            //debuggable true
            buildConfigField "String", "APP_LINK", '""'
            buildConfigField "String", "BASE_URL", "\"https://api.themoviedb.org/3/\""
            buildConfigField "String", "API_KEY", "\"6521adbdad09387a278353f36e241434\""
            // For Android Emulator: use 10.0.2.2 to access host machine's localhost
            // For real device: use your computer's IP address in local network (e.g., "http://192.168.1.100:5001")
            // Note: Port 5001 is used instead of 5001 because macOS AirPlay uses port 5001
            buildConfigField "String", "ASSISTANT_BASE_URL", "\"http://10.0.2.2:5001\""
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

    lintOptions {
        checkDependencies true
        disable "ContentDescription", "AlwaysShowAction"
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

}

